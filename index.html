<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4F4EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A2C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NameSwipe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Swipe through baby names together.">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>NameSwipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#E4F4EC; --dot:#C8E6D6; --ink:#1B2140; --muted:#56607F;
  --card:#FFFFFF; --soft:#F2F6FB; --line:#1B2140; --shadow:#1B2140;
  --sun:#FFCF3A; --sun-ink:#1B2140; --boy:#6BB8F5; --girl:#FF93BA;
  --keep:#16A862; --nope:#E83A50; --track:#CFE4D9; --danger-bg:#FFE3E7;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Avenir Next','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131A2C; --dot:#1D2642; --ink:#EDF0FF; --muted:#A3ACC9;
    --card:#222B49; --soft:#2A3457; --line:#070A14; --shadow:#070A14;
    --track:#2A3457; --keep:#2BC47C; --nope:#FF5A6E; --danger-bg:#4A2433;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131A2C; --dot:#1D2642; --ink:#EDF0FF; --muted:#A3ACC9;
  --card:#222B49; --soft:#2A3457; --line:#070A14; --shadow:#070A14;
  --track:#2A3457; --keep:#2BC47C; --nope:#FF5A6E; --danger-bg:#4A2433;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.8px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.4;
  overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}

/* Top bar */
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding-block:12px 8px}
.bar h1{margin:0;font:800 20px/1.1 var(--display);text-align:center;text-wrap:balance}
.back{display:inline-flex;align-items:center;gap:4px;border:2.5px solid var(--line);background:var(--card);
  border-radius:999px;padding:6px 12px 6px 8px;font-weight:700;font-size:15px;box-shadow:3px 3px 0 var(--shadow)}
.back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.who{min-width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:15px;
  border:2.5px solid var(--line);background:var(--sun);color:var(--sun-ink)}
.who.empty{visibility:hidden}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:16px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Shared pieces */
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  border:2.5px solid var(--line);border-radius:18px;background:var(--card);padding:16px 18px;
  box-shadow:4px 4px 0 var(--shadow);font-weight:700;font-size:18px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.primary{background:var(--sun);color:var(--sun-ink);justify-content:center}
.btn small{font-weight:600;font-size:14px;color:var(--muted)}
.btn.primary small{color:inherit}
.stack{display:flex;flex-direction:column;gap:14px}
.lede{margin:4px 0 18px;color:var(--muted);font-size:16px}
.note{margin-top:auto;padding-top:18px;color:var(--muted);font-size:13px;text-align:center}
.pill{display:inline-block;white-space:nowrap;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--soft)}
.tally{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.bar-track{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:99px;background:var(--ink);transition:width .3s}
input.field{width:100%;border:2.5px solid var(--line);border-radius:14px;background:var(--card);padding:14px 16px;font-size:18px}
.err{color:var(--nope);font-weight:600;min-height:1.4em;margin:8px 0 0;font-size:15px}

/* Password */
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-bottom:10vh}
.logo{position:relative;height:120px;margin-bottom:6px}
.mini{position:absolute;top:10px;width:92px;height:112px;border:2.5px solid var(--line);border-radius:16px;background:var(--card);
  box-shadow:4px 4px 0 var(--shadow);display:grid;place-items:center;font:800 26px var(--display);overflow:hidden}
.mini::before{content:"";position:absolute;inset:0 0 auto 0;height:12px}
.mini.g{left:calc(50% - 96px);transform:rotate(-9deg)} .mini.g::before{background:var(--girl)}
.mini.b{left:calc(50% + 4px);transform:rotate(8deg)} .mini.b::before{background:var(--boy)}
.word{font:800 clamp(44px,13vw,60px)/1 var(--display);letter-spacing:-.03em;text-align:center;margin:0}
.word span{color:var(--keep)}
.gate form{display:flex;flex-direction:column;gap:12px}
.gate label{font-weight:700}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* Users */
.avatar{width:44px;height:44px;border-radius:999px;border:2.5px solid var(--line);display:grid;place-items:center;
  font:800 20px var(--display);flex:none}
.btn .left{display:flex;align-items:center;gap:14px}
.addform{display:flex;gap:10px}
.addform .btn{width:auto;flex:none;padding:12px 16px;font-size:16px}

/* Gender tiles */
.tiles{display:grid;gap:16px}
.tile{position:relative;overflow:hidden;text-align:left;border:2.5px solid var(--line);border-radius:22px;background:var(--card);
  padding:22px 20px 18px;box-shadow:5px 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:14px;background:var(--c)}
.tile h2{margin:6px 0 10px;font:800 30px/1 var(--display)}
.tile .bar-fill{background:var(--c)}

/* Sort */
.sort{flex:1;display:flex;flex-direction:column;min-height:0}
.deck{position:relative;flex:1;min-height:260px;margin:14px 6px 18px 0}
.card{position:absolute;inset:0;border:3px solid var(--line);border-radius:28px;background:var(--card);
  box-shadow:6px 6px 0 var(--shadow);display:grid;place-items:center;container-type:inline-size;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .25s ease}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:16px;background:var(--c)}
.card.under{transform:translateY(12px) scale(.95);z-index:1;cursor:default}
.card.top{z-index:2}
.card.flying{z-index:3;pointer-events:none;transition:transform .38s ease-in,opacity .38s ease-in}
.card.enter{animation:pop .28s ease-out}
.card.return-l{animation:retl .3s ease-out}
.card.return-r{animation:retr .3s ease-out}
@keyframes pop{from{transform:translateY(12px) scale(.95)}to{transform:none}}
@keyframes retl{from{transform:translateX(-120%) rotate(-20deg)}to{transform:none}}
@keyframes retr{from{transform:translateX(120%) rotate(20deg)}to{transform:none}}
.nm{font:800 min(80px,calc((100cqw - 44px) * 1.62 / var(--len)))/1.05 var(--display);letter-spacing:-.02em;
  text-align:center;padding:0 22px;overflow-wrap:anywhere}
.card .kind{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;color:var(--muted)}
.stamp{position:absolute;top:34px;padding:4px 12px;border:4px solid currentColor;border-radius:10px;
  font:800 28px/1 var(--display);letter-spacing:.06em;opacity:0}
.stamp.keep{left:20px;color:var(--keep);transform:rotate(-14deg)}
.stamp.nope{right:20px;color:var(--nope);transform:rotate(14deg)}
.controls{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.round{width:68px;height:68px;border-radius:999px;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;
  box-shadow:4px 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s,background .15s,color .15s}
.round:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.round.nope{color:var(--nope)} .round.keep{color:var(--keep)}
.round.nope.hot{background:var(--nope);color:#fff} .round.keep.hot{background:var(--keep);color:#fff}
.undo{justify-self:center;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);
  border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.undo[disabled]{opacity:.4;cursor:default}
.controls.r2{grid-template-columns:auto auto auto;justify-content:space-between;justify-items:center}
.round.love{color:#E0457B} .round.love.hot{background:#E0457B;color:#fff}
.undo.row2{margin:12px auto 0;display:flex}
.stamp.love{left:50%;top:40px;color:#E0457B;transform:translateX(-50%) rotate(-6deg)}
.card.r2c{container-type:size}
.nm.r2{display:flex;flex-direction:column;align-items:center;line-height:1.05;
  font-size:min(76px,calc((100cqw - 56px) * 1.4 / var(--len)),calc((100cqh - 96px) / var(--n) / 1.12))}
.card.r2c .kind{padding:0 14px}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.done h2{font:800 34px/1.1 var(--display);margin:0}

/* Lists */
.listhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 10px;margin:6px 0 12px}
.listhead h2{margin:0;font:800 24px/1.1 var(--display)}
.names{list-style:none;margin:12px 0 0;padding:0;border:2.5px solid var(--line);border-radius:18px;background:var(--card);
  box-shadow:4px 4px 0 var(--shadow);overflow:hidden}
.names li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 12px 18px;
  border-top:1.5px solid var(--soft);font-size:20px;font-weight:600}
.names li:first-child{border-top:0}
.names li.gone{opacity:0;transform:translateX(30px);transition:.25s}
.unkeep{border:2px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;flex:none}
.unkeep.armed{background:var(--danger-bg);color:var(--nope);border-color:var(--nope)}
.heart{color:var(--nope);flex:none}
.rowact{display:flex;align-items:center;gap:8px;flex:none}
.lovebtn{width:36px;height:36px;border-radius:999px;border:2px solid var(--line);background:var(--soft);display:grid;place-items:center;color:var(--muted);padding:0}
.lovebtn[aria-pressed="true"]{background:#E0457B;color:#fff;border-color:#E0457B}
.names li .lbl{min-width:0;overflow-wrap:anywhere}
.seg{display:flex;border:2.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:transparent;padding:10px 8px;font-weight:700;font-size:15px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink)}
.msg{margin:10px 0 0;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--soft);font-weight:600;font-size:15px}
.msg.ok{background:#D8F5E5} .msg.bad{background:var(--danger-bg)}
.btn.dashed{justify-content:center;border-style:dashed;box-shadow:none;background:transparent}
.btn.small{width:auto;padding:8px 14px;font-size:15px;box-shadow:3px 3px 0 var(--shadow)}
.badge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:#FFD6E5;color:#A3204F;font-size:12px;font-weight:800;vertical-align:middle}
.btn .tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--sun);color:var(--sun-ink);font-size:12px;font-weight:800;vertical-align:middle}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:16px}
.listwrap{flex:1;min-height:0;overflow-y:auto;padding:0 6px 8px 0}

/* Toast + confetti */
.celebrate{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;transition:opacity .25s}
.celebrate.out{opacity:0}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%}
.celebrate .box{position:relative;background:var(--sun);color:var(--sun-ink);border:3px solid var(--line);border-radius:24px;
  box-shadow:6px 6px 0 var(--shadow);padding:20px 24px;text-align:center;font-weight:700;font-size:17px;
  max-width:min(320px,calc(100% - 48px));animation:popin .25s ease-out}
.celebrate .box b{display:block;font:800 34px/1.05 var(--display);margin-bottom:6px}
@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;
  z-index:60;background:var(--sun);color:var(--sun-ink);border:2.5px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--shadow);
  padding:12px 18px;font-weight:800;text-align:center;transition:.3s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>

body{margin:0}
#app{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<div id="app">

    <button class="back" id="backBtn" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Back
    </button>
    <h1 id="barTitle"></h1>
    <span class="who empty" id="whoChip"></span>
  </header>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Name lists (built from SSA top-1000 lists, 1890-2025) ---------- */
window.NAMES_INLINE = null;
</script>
<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n.toLocaleString("en-US");
const G = { boy:{label:"Boy names", one:"boy name", color:"var(--boy)"}, girl:{label:"Girl names", one:"girl name", color:"var(--girl)"} };
const PAIR = ["michael","rebecca"];
const AVATAR_COLORS = ["var(--boy)","var(--girl)","var(--sun)","#9EE6B9","#C9B6FF","#FFB27A"];
const ICON = {
  x:'<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M4.5 12.8l4.8 4.7L19.5 7" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  undo:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 010 11H11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  heart:'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 2.7c0 5.6-7.5 10.2-7.5 10.2z" fill="currentColor"/></svg>',
  loveBtn:'<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 2.7c0 5.6-7.5 10.2-7.5 10.2z" fill="currentColor"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* ---------- Storage (preview: this device only) ----------
   Every method is async so the Supabase version can drop in with the same shape. */
const LocalStore = (function(){
  const KEY = "nameswipe:v1";
  let mem = null;
  function read(){
    if (mem) return mem;
    try { const raw = localStorage.getItem(KEY); if (raw) mem = JSON.parse(raw); } catch(e) {}
    if (!mem || !Array.isArray(mem.users)) mem = { users:[{id:"michael",name:"Michael"},{id:"rebecca",name:"Rebecca"}], dec:{} };
    return mem;
  }
  function write(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e) {} }
  function bucket(uid, g){ const d = read(); d.dec[uid] = d.dec[uid] || {}; d.dec[uid][g] = d.dec[uid][g] || {}; return d.dec[uid][g]; }
  return {
    local: true,
    async checkPassword(pw){ const want = window.PREVIEW_PASSWORD; return want && pw.trim().toLowerCase() === want ? "ok" : "wrong"; },
    async signOut(){},
    async listUsers(){ return read().users.slice(); },
    async addUser(name){
      const d = read();
      let base = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "user", id = base, i = 2;
      while (d.users.some(u => u.id === id)) id = base + "-" + (i++);
      const u = { id, name }; d.users.push(u); write(); return u;
    },
    async getDecisions(uid, g){ return Object.assign({}, bucket(uid, g)); },
    async setDecision(uid, g, name, val){ bucket(uid, g)[name] = val; write(); },
    async clearDecision(uid, g, name){ delete bucket(uid, g)[name]; write(); },
    async partnerKept(uid, g, name){
      const other = uid === "michael" ? "rebecca" : uid === "rebecca" ? "michael" : null;
      return other ? bucket(other, g)[name] === 1 : false;
    },
    async getMatches(g){
      const a = bucket("michael", g), b = bucket("rebecca", g);
      return Object.keys(a).filter(n => a[n] === 1 && b[n] === 1);
    },
    /* Round 2 (preview): the pool is built into the page; votes stay on this device */
    canAddNames: true,
    async getPool(){
      const base = window.POOL_INLINE; if (!base) return null;
      const d = read(); d.writeins = d.writeins || [];
      const out = { boy: base.boy.slice(), girl: base.girl.slice() };
      d.writeins.forEach(w => out[w.gender].push({ id:w.id, names:[w.name], addedBy:w.by }));
      return out;
    },
    async addWriteIn(uid, g, name){
      const d = read(); d.writeins = d.writeins || [];
      const id = 100000 + d.writeins.length + 1 + Math.floor(Math.random() * 1000);
      d.writeins.push({ id, gender:g, name, by:uid }); write(); return id;
    },
    async removeWriteIn(uid, g, name){
      const d = read(); d.writeins = (d.writeins || []).filter(w => !(w.gender === g && w.name === name));
      Object.keys(d.dec2 || {}).forEach(u => { const b = (d.dec2[u] || {})[g]; if (b) delete b[name]; }); write();
    },
    async getVotes2(uid, g){ const d = read(); d.dec2 = d.dec2 || {}; return Object.assign({}, (d.dec2[uid] || {})[g] || {}); },
    async setVotes2(uid, g, names, vote){
      const d = read(); d.dec2 = d.dec2 || {}; d.dec2[uid] = d.dec2[uid] || {}; d.dec2[uid][g] = d.dec2[uid][g] || {};
      names.forEach(n => { d.dec2[uid][g][n] = vote; }); write();
    },
    async clearVotes2(uid, g, names){
      const d = read(); d.dec2 = d.dec2 || {}; const b = ((d.dec2[uid] || {})[g]); if (b) names.forEach(n => { delete b[n]; }); write();
    },
    async partnerVote2(uid, g, names){
      const other = uid === "michael" ? "rebecca" : uid === "rebecca" ? "michael" : null; if (!other) return null;
      const d = read(); const b = ((d.dec2 || {})[other] || {})[g] || {}; return names[0] in b ? b[names[0]] : null;
    },

const CFG = window.NAMESWIPE_CONFIG || {};
function makeSupabaseStore(){

    auth: { persistSession:false, autoRefreshToken:true, detectSessionInUrl:false }

  let chain = Promise.resolve();

      let last;
      for (let i = 0; i < 4; i++){
        try { return await fn(); }
        catch (e){ last = e; if (e && (e.status === 401 || e.code === "PGRST301" || e.code === "42501")) break; await wait(500 * (i + 1) * (i + 1)); }

    },
    async signOut(){ try { await sb.auth.signOut({ scope:"local" }); } catch(e){} },
    async listUsers(){ return readAll(() => sb.from("app_users").select("id,name").order("created_at").order("id")); },
    async addUser(name){
      const users = await this.listUsers();
      let base = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "user", id = base, i = 2;
      while (users.some(u => u.id === id)) id = base + "-" + (i++);

      return { id, name };
    },
    async getDecisions(uid, g){
      const rows = await readAll(() => sb.from("decisions").select("name,keep").eq("user_id", uid).eq("gender", g).order("name"));
      const out = {}; rows.forEach(r => { out[r.name] = r.keep; }); return out;
    },
    setDecision(uid, g, name, val){
      return queue(async () => must(await sb.from("decisions").upsert({ user_id:uid, gender:g, name, keep:val }, { onConflict:"user_id,gender,name" })));
    },
    clearDecision(uid, g, name){
      return queue(async () => must(await sb.from("decisions").delete().eq("user_id", uid).eq("gender", g).eq("name", name)));
    },
    async partnerKept(uid, g, name){
      const other = uid === "michael" ? "rebecca" : uid === "rebecca" ? "michael" : null;
      if (!other) return false;
      const rows = must(await sb.from("decisions").select("keep").eq("user_id", other).eq("gender", g).eq("name", name));
      return rows.length > 0 && rows[0].keep === 1;
    },
    async getMatches(g){
      const rows = await readAll(() => sb.from("matches").select("name").eq("gender", g).order("name"));
      return rows.map(r => r.name);
    },
    /* Round 2: separate tables (r2_pool, decisions_r2, matches_r2). Round 1 tables are never touched. */
    canAddNames: false,
    async getPool(){
      // Newer database has added_by (for write-in names). Fall back if that update hasn't been run yet.
      let rows;

        rows = await readAll(() => sb.from("r2_pool").select("gender,name,card_id,pos,source,added_by").order("gender").order("card_id").order("pos"));
        this.canAddNames = true;
      } catch (e){
        this.canAddNames = false;
        rows = await readAll(() => sb.from("r2_pool").select("gender,name,card_id,pos").order("gender").order("card_id").order("pos"));
      }
      if (!rows.length) return null;
      const out = { boy:[], girl:[] }, seen = {};

        const key = r.gender + ":" + r.card_id;
        if (!seen[key]){ seen[key] = { id:r.card_id, names:[] }; if (r.source === "writein") seen[key].addedBy = r.added_by; out[r.gender].push(seen[key]); }
        seen[key].names.push(r.name);

    },
    addWriteIn(uid, g, name){
      return queue(async () => {
        const rows = must(await sb.from("r2_pool").insert({ gender:g, name, pos:0, source:"writein", added_by:uid }).select("card_id"));
        return rows[0].card_id;
      });
    },
    removeWriteIn(uid, g, name){

    },
    async getVotes2(uid, g){
      const rows = await readAll(() => sb.from("decisions_r2").select("name,vote").eq("user_id", uid).eq("gender", g).order("name"));
      const out = {}; rows.forEach(r => { out[r.name] = r.vote; }); return out;
    },
    setVotes2(uid, g, names, vote){

    },
    clearVotes2(uid, g, names){

    },
    async partnerVote2(uid, g, names){
      const other = uid === "michael" ? "rebecca" : uid === "rebecca" ? "michael" : null;
      if (!other) return null;
      const rows = must(await sb.from("decisions_r2").select("vote").eq("user_id", other).eq("gender", g).eq("name", names[0]));
      return rows.length ? rows[0].vote : null;
    },
    async getMatches2(g, pool){
      const rows = await readAll(() => sb.from("matches_r2").select("card_id,name,michael_vote,rebecca_vote").eq("gender", g).order("card_id"));

      rows.forEach(r => { if (!seen[r.card_id] && byId[r.card_id]){ seen[r.card_id] = 1; out.push({ id:r.card_id, names:byId[r.card_id].names, mv:r.michael_vote, rv:r.rebecca_vote }); } });
      return out;
    }
  };

        b.classList.add("armed"); b.textContent = "Tap to confirm";
        clearTimeout(b._t); b._t = setTimeout(() => { b.classList.remove("armed"); b.textContent = "Remove"; }, 3500);
        return;
      }
      b.disabled = true;
      try {
        await Store.removeWriteIn(S.user.id, b.dataset.g, b.dataset.n);
        S.pool[b.dataset.g] = cards2(b.dataset.g).filter(c => !(c.addedBy === S.user.id && c.names[0] === b.dataset.n));

      } catch (err){ b.disabled = false; say("Couldn't remove that. Check your connection and try again.", "bad"); }
    });
    let ignoreNear = false;
    const doAdd = async () => {
      const raw = $("#wiName").value;
      const name = cleanName(raw);
      if (!name){ say("Use letters only (spaces, hyphens and apostrophes are fine), 2 to 24 characters.", "bad"); return; }
      const lists = target === "both" ? ["boy", "girl"] : [target];
      const added = [], skipped = [], near = [];
      for (const g of lists){
        const pool = cards2(g), low = name.toLowerCase();
        const hit = pool.find(c => c.names.some(n => n.toLowerCase() === low));
        if (hit){ skipped.push(`${esc(name)} is already a ${G[g].one} card${hit.names.length > 1 ? " (" + esc(hit.names.join(" / ")) + ")" : ""}.`); continue; }
        if (!ignoreNear){
          const close = pool.find(c => c.names.some(n => n[0].toLowerCase() === low[0] && lev(n.toLowerCase(), low) === 1));
          if (close){ near.push(`${esc(name)} looks close to ${esc(close.names.join(" / "))}, which is already a ${G[g].one} card.`); continue; }
        }
        added.push(g);
      }
      if (near.length && !added.length){

      const btn = $("#wiForm button"); btn.disabled = true;
      try {
        for (const g of added){
          const id = await Store.addWriteIn(S.user.id, g, name);
          S.pool[g] = cards2(g).concat([{ id, names:[name], addedBy:S.user.id }]);
          S.dec2[g][name] = 1;
          await Store.setVotes2(S.user.id, g, [name], 1);
        }
        const where = added.length === 2 ? "boy names and girl names" : G[added[0]].one + "s";
        say(`Added ${esc(name)} to ${where} and kept it.` + (skipped.length ? " " + skipped.join(" ") : ""), "ok");
        $("#wiName").value = ""; ignoreNear = false; drawMine();
      } catch (err){
        console.error(err);
        const dup = err && (err.code === "23505");
        say(dup ? esc(name) + " is already on the list." : "Couldn't add that name. If this keeps happening, the database update for adding names may not have been run yet.", "bad");
      }
      btn.disabled = false;
    };

/* ---------- Swiping ---------- */
function updateTally(){
  const g = S.gender, L = S.queue.length, T = isR2() ? cards2(g).length : total(g);
  const t = $("#sortTally"); if (!t) return;
  t.textContent = isR2() ? `${fmt(L)} cards left of ${fmt(T)}` : `${fmt(L)} left of ${fmt(T)} · ${fmt(L)}/${fmt(T)}`;
  $("#sortBar").style.width = (T ? (T-L)/T*100 : 0).toFixed(1) + "%";
  $("#btnUndo").disabled = !S.history.length;
}

function cardHTML(name, cls){
  if (isR2()){
    const names = name.names, n = names.length;
    return `<div class="card r2c ${cls}" data-id="${name.id}">
    <span class="stamp keep" aria-hidden="true">KEEP</span><span class="stamp nope" aria-hidden="true">NOPE</span><span class="stamp love" aria-hidden="true">LOVE</span>
    <span class="nm r2" style="--len:${Math.max(4, ...names.map(x => x.length))};--n:${n}">${names.map(x => `<span>${esc(x)}</span>`).join("")}</span>
    <span class="kind">${n > 1 ? "one vote covers all " + n + " names" : G[S.gender].one}</span></div>`;
  }
  return `<div class="card ${cls}" data-name="${esc(name)}">
    <span class="stamp keep" aria-hidden="true">KEEP</span><span class="stamp nope" aria-hidden="true">NOPE</span>
    <span class="nm" style="--len:${Math.max(4, name.length)}">${esc(name)}</span>
    <span class="kind">${G[S.gender].one}</span></div>`;
}

function renderDeck(anim){
  const deck = $("#deck"); if (!deck) return;
  deck.querySelectorAll(".card:not(.flying)").forEach(c => c.remove());
  const [a, b] = S.queue;
  if (!a){
    $("#controls").hidden = true;
    const kept = isR2() ? keptCards(S.gender).length : keptList(S.gender).length;
    deck.insertAdjacentHTML("beforeend", `<div class="done">
      <h2>All sorted!</h2><p class="lede" style="margin:0">${isR2() ? `You've been through every Round 2 card. You kept ${fmt(kept)}.` : `You've been through every ${G[S.gender].one}. You kept ${fmt(kept)}.`}</p>
      <button class="btn primary" type="button" id="doneReview" style="width:auto">See my kept names</button>
      ${S.history.length ? `<button class="undo" type="button" id="doneUndo">${ICON.undo}Undo</button>` : ""}</div>`);
    const du = $("#doneUndo"); if (du) du.addEventListener("click", undo);
    $("#doneReview").addEventListener("click", () => { if (isR2()){ show("r2menu"); go("r2review"); } else { show("menu"); go("review"); } });
    return;
  }
  $("#controls").hidden = false;
  if (b) deck.insertAdjacentHTML("beforeend", cardHTML(b, "under"));
  deck.insertAdjacentHTML("beforeend", cardHTML(a, "top" + (anim ? " " + anim : "")));
  bindDrag(deck.querySelector(".card.top"));
}

function setHot(dx, dy){
  $("#btnKeep").classList.toggle("hot", dx > 60);
  $("#btnNope").classList.toggle("hot", dx < -60);
  const lv = $("#btnLove"); if (lv) lv.classList.toggle("hot", (dy || 0) < -80 && Math.abs(dx) < 60);
}

function bindDrag(el){
  let sx = 0, sy = 0, dx = 0, dy = 0, t0 = 0, down = false;
  const keep = el.querySelector(".stamp.keep"), nope = el.querySelector(".stamp.nope"), love = el.querySelector(".stamp.love");
  el.addEventListener("pointerdown", e => {
    if (e.button !== undefined && e.button !== 0) return;
    down = true; sx = e.clientX; sy = e.clientY; dx = dy = 0; t0 = performance.now();
    el.style.transition = "none"; el.classList.remove("enter","return-l","return-r");
    try { el.setPointerCapture(e.pointerId); } catch(err){}
  });
  el.addEventListener("pointermove", e => {
    if (!down) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    el.style.transform = `translate(${dx}px, ${dy * 0.35}px) rotate(${dx / 18}deg)`;
    const up = love && dy < -30 && -dy > Math.abs(dx);
    keep.style.opacity = up ? 0 : Math.max(0, Math.min(1, dx / 90));
    nope.style.opacity = up ? 0 : Math.max(0, Math.min(1, -dx / 90));
    if (love) love.style.opacity = up ? Math.max(0, Math.min(1, -dy / 100)) : 0;
    setHot(dx, up ? dy : 0);
  });
  const end = () => {
    if (!down) return; down = false;
    const v = Math.abs(dx) / Math.max(1, performance.now() - t0);
    const vy = Math.abs(dy) / Math.max(1, performance.now() - t0);
    if (love && -dy > 110 && -dy > Math.abs(dx) * 1.2 || love && vy > 0.6 && dy < -50 && -dy > Math.abs(dx)) fly(2);
    else if (Math.abs(dx) > 100 || (v > 0.6 && Math.abs(dx) > 40)) fly(dx > 0 ? 1 : 0, dy);
    else { el.style.transition = ""; el.style.transform = ""; keep.style.opacity = nope.style.opacity = 0; if (love) love.style.opacity = 0; setHot(0); }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

function fly(val, dy){
  const el = $("#deck .card.top"); if (!el) return;
  el.classList.remove("top","enter","return-l","return-r"); el.classList.add("flying");
  el.querySelector(val === 2 ? ".stamp.love" : val ? ".stamp.keep" : ".stamp.nope").style.opacity = 1;
  const dir = val ? 1 : -1;
  requestAnimationFrame(() => {
    el.style.transform = val === 2
      ? `translate(0px, ${-(window.innerHeight + 200)}px) rotate(-6deg)`
      : `translate(${dir * (window.innerWidth + 200)}px, ${(dy || 0) * 0.35 + 60}px) rotate(${dir * 28}deg)`;
    el.style.opacity = "0.9";
  });
  setTimeout(() => el.remove(), 420);
  setHot(0);
  decide(val);
}

function decide2(val){
  const g = S.gender, uid = S.user.id, card = S.queue.shift();
  if (card === undefined) return;
  card.names.forEach(n => { S.dec2[g][n] = val; });
  S.history.push({ card, val });
  Store.setVotes2(uid, g, card.names, val).catch(saveFailed);
  renderDeck();
  updateTally();
  if (val >= 1) Store.partnerVote2(uid, g, card.names).then(pv => {
    if (pv >= 1 && S.screen === "r2sort"){
      const lab = esc(cardLabel(card));
      celebrate(val === 2 && pv === 2 ? `<b>You both love it!</b>${lab}` : `<b>It's a match!</b>You and ${esc(partnerName())} both kept ${lab}.`);
    }
  }).catch(() => {});
}

function decide(val){
  if (isR2()) return decide2(val);
  const g = S.gender, uid = S.user.id, name = S.queue.shift();
  if (name === undefined) return;
  S.dec[g][name] = val;
  S.history.push({ name, val });
  Store.setDecision(uid, g, name, val).catch(saveFailed);
  renderDeck();
  updateTally();
  if (val === 1) Store.partnerKept(uid, g, name).then(k => {
    if (k && S.screen === "sort") celebrate(`<b>It's a match!</b>You and ${esc(partnerName())} both kept ${esc(name)}.`);
  }).catch(() => {});
}

function undo(){
  const step = S.history.pop();
  if (!step) return;
  if (isR2()){
    const g = S.gender, { card, val } = step;
    card.names.forEach(n => { delete S.dec2[g][n]; });
    S.queue.unshift(card);
    Store.clearVotes2(S.user.id, g, card.names).catch(saveFailed);
    renderDeck(val === 2 ? "return-l" : val ? "return-r" : "return-l");
    updateTally();
    return;
  }
  const g = S.gender, { name, val } = step;
  delete S.dec[g][name];
  S.queue.unshift(name);
  Store.clearDecision(S.user.id, g, name).catch(saveFailed);
  renderDeck(val ? "return-r" : "return-l");
  updateTally();
}

document.addEventListener("keydown", e => {
  if ((S.screen !== "sort" && S.screen !== "r2sort") || e.target.matches("input")) return;
  if (e.key === "ArrowLeft"){ e.preventDefault(); fly(0); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); fly(1); }
  else if (e.key === "ArrowUp" && S.screen === "r2sort"){ e.preventDefault(); fly(2); }
  else if (e.key.toLowerCase() === "z" || e.key === "Backspace"){ e.preventDefault(); undo(); }
});

/* ---------- Toast + confetti ---------- */
let toastT;
function toast(msg, ms){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms || 2200);
}
function saveFailed(){ toast("Couldn't save that choice. Check your connection.", 3500); }

/* A match (or opening Our matches) shows confetti, plus an optional message, for 1.5 seconds.
   Everything is built fresh each time and fully removed afterwards, so nothing can linger on screen. */
const CELEBRATE_MS = 1500;
let party = null;
function endCelebrate(){
  if (!party) return;
  cancelAnimationFrame(party.raf); clearTimeout(party.fade); clearTimeout(party.kill);
  party.el.remove(); party = null;
}
function celebrate(html){
  endCelebrate();
  const el = document.createElement("div");
  el.className = "celebrate";
  el.setAttribute("role", "status");
  el.innerHTML = `<canvas aria-hidden="true"></canvas>${html ? `<div class="box">${html}</div>` : ""}`;
  document.body.appendChild(el);
  const me = party = { el, raf:0 };
  me.fade = setTimeout(() => el.classList.add("out"), CELEBRATE_MS - 250);
  me.kill = setTimeout(() => { if (party === me) endCelebrate(); }, CELEBRATE_MS);
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = el.querySelector("canvas"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  const colors = ["--sun","--boy","--girl","--keep","--nope"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({length:140}, (_, i) => ({
    x: W * (i % 2 ? 0.2 : 0.8), y: H * 0.45,
    vx: (Math.random() - 0.5) * 14 + (i % 2 ? 3 : -3), vy: -Math.random() * 15 - 5,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
    c: colors[i % colors.length]
  }));
  (function frame(){
    if (party !== me) return;
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.vy += 0.42; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h * Math.abs(Math.cos(p.r))); ctx.restore();
    });
    me.raf = requestAnimationFrame(frame);
  })();
}
document.addEventListener("visibilitychange", () => { if (document.hidden) endCelebrate(); });

async function boot(){
  if (!NAMES){
    try { const r = await fetch("names.json", { cache:"no-cache" }); NAMES = await r.json(); }
    catch (e){
      view.innerHTML = `<div class="done"><h2>Couldn't start</h2><p class="lede" style="margin:0">The name lists didn't load. Check your internet connection, then reopen the app.</p></div>`;
      return;
    }
  }
  show("password");
}
boot();
})();
</script>
